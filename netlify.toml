[build]
  command = "npm install && npm run blogs:install && npm run build:all"
  publish = "build"

[build.environment]
  NODE_VERSION = "22"

# Serve the blogs site's own pages first, then fall back to the portfolio's
# index.html so React Router routes (e.g. /projects) work on refresh.
# Existing files (like /blogs/index.html) are served before this rule applies.
[[redirects]]
  from = "/blogs/*"
  to = "/blogs/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
